name: 功能或实验建议
description: 描述使用场景、拟议改动和判断是否有效的办法。
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 在什么具体场景下，现有行为造成了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的行为或实验
      description: 描述希望得到的结果，以及本地运行、硬件或数据方面的约束。
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: 如何验证
      description: 给出可观察的成功标准，例如术语错误、误插入、纠错时间或回归用例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的办法或参考资料
